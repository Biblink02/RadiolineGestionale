services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    restart: "no"
    extra_hosts:
      - host.docker.internal:host-gateway
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && exec php-fpm"

  caddy:
    image: caddy:2.11.4-alpine
    restart: "no"
    ports:
      - "8100:80"
    environment:
      CADDY_SITE: ":80"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/public:/var/www/app/public:ro
      - ./src/storage/app/public:/var/www/app/storage/app/public:ro
    depends_on:
      - app

  scheduler:
    extends:
      file: docker-compose.yml
      service: scheduler
    restart: "no"

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    profiles: [dev]
    ports:
      - "3100:3100"
    command: sh -c "bun install --frozen-lockfile && bun run dev"

  database:
    extends:
      file: docker-compose.yml
      service: database
    restart: "no"
    ports:
      - "127.0.0.1:${DATABASE_BIND_PORT}:3306"

networks:
  default:
    name: "vpc_${CONTAINER_NAME}"
    driver: bridge
    ipam:
      config:
        - subnet: "${CONTAINER_NETWORK_SUBNET}"

volumes:
  database:
