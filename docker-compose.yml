x-php: &php
  build:
    context: .
    dockerfile: docker/php.Dockerfile
  image: radioline-php:8.3
  restart: unless-stopped
  user: "${HOST_USER_UID:-1000}:${HOST_USER_GID:-1000}"
  environment:
    NGINX_PHP_PM_MAX_CHILDREN: "${NGINX_PHP_PM_MAX_CHILDREN:-10}"
  volumes:
    - ./src:/var/www/app

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_SITE: "${CADDY_SITE:-:80}"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/public:/var/www/app/public:ro
      - ./src/storage/app/public:/var/www/app/storage/app/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    <<: *php
    depends_on:
      database:
        condition: service_healthy
    networks:
      default:
        ipv4_address: "${CONTAINER_SERVICE_APP_IP_ADDRESS}"
        aliases:
          - "${CONTAINER_NAME}-docker.local"

  scheduler:
    <<: *php
    command: php artisan schedule:work
    init: true
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:11.1
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        ipv4_address: "${CONTAINER_SERVICE_DATABASE_IP_ADDRESS}"
        aliases:
          - "${CONTAINER_NAME}-database.local"

  frontend:
    image: oven/bun:1
    profiles: [tools]
    user: "${HOST_USER_UID:-1000}:${HOST_USER_GID:-1000}"
    working_dir: /var/www/app
    volumes:
      - ./src:/var/www/app
    command: sh -c "bun install --frozen-lockfile && bun run build"

networks:
  default:
    name: "vpc_${CONTAINER_NAME}"
    driver: bridge
    ipam:
      config:
        - subnet: "${CONTAINER_NETWORK_SUBNET}"

volumes:
  database:
  caddy_data:
  caddy_config:
