; Overrides for the official PHP production configuration.
expose_php = Off
memory_limit = 512M
upload_max_filesize = 24M
post_max_size = 24M
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Bind-mounted deployments must see changed PHP files without stale bytecode.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
